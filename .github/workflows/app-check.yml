name: app-check

# Runs the suite, the compiler and the linter on every pull request and on every push to main. The
# commands are the project's own scripts rather than equivalents, so CI checks exactly what a
# contributor runs locally.
#
# pull_request, never pull_request_target. A pull request from a fork runs its own code here, so it
# gets a read-only token, no secrets, and a GitHub-hosted runner that is discarded after the job.
on:
  pull_request:
  push:
    branches: [main]

# The job only reads the checkout, so the token is given nothing it could write with.
permissions:
  contents: read

# A new push to a pull request cancels the run it replaces. A run on main is keyed by its commit, so
# it is never cancelled or replaced and every commit on main keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # The quicker checks run first, so a type or lint error fails the job before the suite starts.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing here pushes, so the token is not left in .git/config for later steps to read.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      # --ignore-scripts matches .npmrc, and the native artifacts the postinstall would fetch are
      # only needed to build for a device. Nothing here does.
      - run: npm ci --ignore-scripts
      - run: ./scripts/typecheck.sh
      - run: npx eslint .
      - run: npx jest --ci
