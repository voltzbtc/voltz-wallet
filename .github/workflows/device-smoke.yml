name: device-smoke

# Starts the app on an Android emulator and asserts it draws a screen of its own. The unit suite
# cannot answer this: a native library that fails to load or a JavaScript bundle that crashes on
# start passes every test and still leaves the device on the launcher.
#
# It runs the same script a person runs by hand, so there is one walk to maintain, not two.
#
# Boot-only on purpose. Everything past the PIN (the balance, the lightning address, resolving that
# address from outside) needs a wallet that already holds an address, and a wallet here would mean a
# seed in a secret store. Those checks stay a release gate on a machine with a test wallet:
# `node scripts/device-smoke.mjs --pin <pin>`.
#
# No API key is needed. The first screen renders before the app connects to anything, and a missing
# key reads as undefined (src/config.ts) rather than throwing, so a build without one cannot connect
# but still starts.
#
# Manual only, since a run takes most of an hour. The same walk runs locally before a release with
# `node scripts/device-smoke.mjs --android --boot-only`.
on:
  workflow_dispatch:

# The job only reads the checkout, so the token is given nothing it could write with.
permissions:
  contents: read

# One run at a time, and the newest wins. A run holds a runner for most of an hour and publishes
# nothing, so cancelling a superseded one loses only a result for a commit already replaced.
concurrency:
  group: device-smoke
  cancel-in-progress: true

jobs:
  smoke:
    # Linux, because the walk drives Android through adb and needs no macOS runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing here pushes, so the token is not left in .git/config for later steps to read.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      # The runner has /dev/kvm, but its user is not in the kvm group, so the emulator action logs
      # "ProbeKVM: This user doesn't have permissions to use KVM (/dev/kvm)" and starts with
      # -accel off. Software emulation is too slow for adb to connect, and the failure reads as a
      # broken emulator (a broken pipe from the package service) rather than a slow one. This udev
      # rule opens the device to every user.
      - name: let the emulator use the hardware that is already there
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The stock runner lacks the disk for this build. A runner that runs out of disk does not fail
      # cleanly: the steps after it report no conclusion and no log, and "No space left on device"
      # appears only in the check annotation.
      #
      # Removed by path rather than through an action, so what leaves is visible here and nothing new
      # enters the supply chain to reclaim a few gigabytes. These are toolchains a React Native build
      # never touches.
      - name: make room
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
                      /opt/ghc /usr/local/.ghcup /usr/share/swift \
                      /usr/local/share/powershell /usr/local/lib/node_modules
          df -h / | tail -1

      - run: npm ci --ignore-scripts
      # The native artifacts the postinstall would have fetched. .npmrc turns dependency scripts off
      # on purpose, so this is the one place that asks for them, by name.
      - run: npm run native:fetch
      # The Firebase client configuration is not in the repository, and Gradle refuses to build
      # without one. The placeholder builds an app with push notifications off, which is all a boot
      # check needs, so this job holds no Firebase secret. See docs/firebase.md.
      - run: node scripts/firebase-config.mjs
      - run: df -h / | tail -1

      # A debug build carries no JavaScript: it fetches it from the Metro dev server at launch. A
      # runner has no dev server, so without a packaged bundle the app dies in
      # loadJSBundleFromAssets. Packaging it here lets the APK run on its own.
      - name: package the javascript into the app
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle --platform android --dev false --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res
          test -s android/app/src/main/assets/index.android.bundle

      # One architecture, because the emulator below is x86_64 and the other three would be compiled
      # and never loaded. Each ABI carries its own native build tree, which is most of what the build
      # writes to disk.
      - run: ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=x86_64
        working-directory: android
      - run: df -h / | tail -1

      # Pinned by commit rather than by tag, because this action is not from GitHub and a tag can be
      # moved to point at anything after it is reviewed. The SHA is v2.38.0, read from the tags API.
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            node scripts/device-smoke.mjs --android --boot-only
